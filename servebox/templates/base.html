<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}ServeBox{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body data-current-path="{{ current_path }}" data-readonly="{{ 'true' if readonly else 'false' }}" data-max-upload="{{ config.max_upload_bytes }}">
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
      <symbol id="i-newfolder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M12 10.5v5M9.5 13h5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
    </svg>

    {% block content %}{% endblock %}

    <div id="ctxMenu" class="menu" role="menu" hidden></div>

    <div id="quickLook" class="ql-root" hidden>
      <div class="ql-overlay" data-ql-close></div>
      <div class="ql-panel" role="dialog" aria-modal="true" aria-labelledby="qlTitle">
        <header class="ql-head">
          <button class="tb-btn" type="button" data-ql-close aria-label="Close"><svg><use href="#i-close"/></svg></button>
          <strong id="qlTitle"></strong>
          <a id="qlDownload" class="tb-btn" aria-label="Download"><svg><use href="#i-download"/></svg></a>
          <a id="qlOpen" class="button compact">Open</a>
        </header>
        <div id="qlBody" class="ql-body"></div>
      </div>
    </div>

    <div id="modalRoot" class="modal-root" hidden>
      <div class="modal-overlay" data-modal-cancel></div>
      <form id="modalForm" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle"></h2>
        <p id="modalMessage" class="modal-message"></p>
        <label id="modalInputWrap" class="modal-input-wrap" hidden>
          <span id="modalInputLabel"></span>
          <input id="modalInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <div class="modal-actions">
          <button id="modalCancel" class="button" type="button" data-modal-cancel>Cancel</button>
          <button id="modalConfirm" class="button primary" type="submit">Confirm</button>
        </div>
      </form>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </body>
</html>
