<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>ServeBox Login</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body>
    <main class="center-page">
      <form class="card login" method="post" action="/login">
        <h1>ServeBox</h1>
        <p>Enter the access token to continue.</p>
        {% if error %}
          <div class="notice danger" role="alert">{{ error }}</div>
        {% endif %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="token">Token</label>
        <input id="token" name="token" type="password" autocomplete="current-password" autofocus required>
        <button class="button primary" type="submit">Log in</button>
      </form>
    </main>
  </body>
</html>
